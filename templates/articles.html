{% extends 'base.html' %}
{% block main %}
{% endblock %}
{% block body %}
    <div class="article-container">
        {% for article in articles %}
        <div class="article">
            <div>
                <p class="tag-pill">{{ article.tag }}</p>
            </div>
            <a class="article-title" href="{{ article.link }}"
            >{{ article.title }}</a>
            <div>
                <p class="summary">{{ article.summary }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
